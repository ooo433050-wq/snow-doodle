<style>
/* Layout: one full-bleed snow canvas, a falling-flake layer above it, and a small frosted toolbar pinned bottom-right. */
:root {
  --bg: #f6f9fd;
  --ui-bg: rgba(255,255,255,.58);
  --ui-fg: #6f7f93;
  --ui-line: rgba(120,135,155,.26);
  --ui-on: rgba(255,255,255,.95);
  --ui-ring: rgba(111,127,147,.55);
  --font: 'Prompt', 'Noto Sans Thai', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ui-fg);
  font-family: var(--font);
  overflow: hidden;
  transition: background .8s ease;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#snow, #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#snow { touch-action: none; cursor: crosshair; }
#fx { pointer-events: none; }

#hint {
  position: fixed; left: 0; right: 0; top: 46%;
  text-align: center; font-weight: 300; font-size: 15px; letter-spacing: .08em;
  color: var(--ui-fg); opacity: .7; pointer-events: none;
  transition: opacity 1.2s ease;
  padding: 0 24px;
}
#hint.gone { opacity: 0; }

#bar {
  position: fixed;
  right: calc(14px + env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100vw - 28px - env(safe-area-inset-right, 0px) - env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
}
.grp {
  display: flex; align-items: center; gap: 2px;
  padding: 4px; border-radius: 999px;
  background: var(--ui-bg);
  border: 1px solid var(--ui-line);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  transition: opacity .3s ease, background .8s ease;
}
.grp.dim { opacity: .42; }
.btn {
  appearance: none; -webkit-appearance: none; border: 0; margin: 0; padding: 0;
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: transparent; color: var(--ui-fg);
  transition: background .25s ease, transform .2s ease;
}
.btn:hover { background: var(--ui-on); }
.btn:active { transform: scale(.92); }
.btn[aria-pressed="true"] { background: var(--ui-on); box-shadow: 0 0 0 1px var(--ui-ring) inset; }
.btn:focus-visible { outline: 2px solid var(--ui-ring); outline-offset: 2px; }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.btn svg .f { fill: currentColor; stroke: none; }
.dot i { display: block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(110,125,145,.35); }
.dot[data-theme="white"] i { background: #fbfdff; }
.dot[data-theme="vanilla"] i { background: #f6e9c8; }
.dot[data-theme="mist"] i { background: #c9d7e8; }
.sz i { display: block; border-radius: 50%; background: currentColor; }
@media (prefers-reduced-motion: reduce) { body, .grp, .btn { transition: none; } }

</div>

/* ---------- carving ---------- */
function dab(cx, cy, r) {

      C[i] = nC;
    }
  }
  recompute(x0, y0, x1, y1);
  markDirty(x0 - 1, y0 - 1, x1 + 1, y1 + 1);
}


function boxBlur(src, w, h, rad, passes) {

      sum = 0;
      for (y = -rad; y <= rad; y++) sum += b[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (y = 0; y < h; y++) {

/* ---------- stamp shapes (unit: 1 = S/100) ---------- */

var PAW = [{ k: 1, draw: function (c) {

var SNOWMAN = [
  { k: .8, draw: function (c) {
    circ(c, 0, 33, 29); circ(c, 0, -5, 21); circ(c, 0, -34, 15);
    c.lineWidth = 3.2; c.lineCap = 'round'; c.strokeStyle = '#fff';
    c.beginPath(); c.moveTo(-18, -10); c.lineTo(-38, -24); c.moveTo(18, -10); c.lineTo(38, -22); c.stroke();

/* ---------- falling flakes + dust ---------- */
var sprite = document.createElement('canvas');

(function () {

  fctx.clearRect(0, 0, cssW, cssH);

  for (i = flakes.length - 1; i >= 0; i--) {
    f = flakes[i];
    f.y += f.vy * dt * (f.tmp ? 2.4 : 1);
    f.x += Math.sin(t / 1400 + f.ph) * f.sw * dt * .5;
    if (f.y > cssH + 12) { if (f.tmp) { flakes.splice(i, 1); continue; } f.y = -10; f.x = Math.random() * cssW; }
    s = f.r * 2.6;
    fctx.globalAlpha = f.a;
    fctx.drawImage(sprite, f.x - s / 2, f.y - s / 2, s, s);
  }
  for (i = dust.length - 1; i >= 0; i--) {
    f = dust[i];
    f.life -= dt * 1.5;
    if (f.life <= 0) { dust.splice(i, 1); continue; }
    f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= .96; f.vy = f.vy * .96 + 14 * dt;
    s = f.r * 2.8;
    fctx.globalAlpha = Math.min(1, f.life) * .9;
    fctx.drawImage(sprite, f.x - s / 2, f.y - s / 2, s, s);
  }
  fctx.globalAlpha = 1;
}

/* ---------- input ---------- */
var tool = 'brush', size = 'm', SIZES = { s: 6, m: 13, l: 26 };
var drawing = false, last = null, speed = 0, lastT = 0, started = false;
var hint = $('hint');

function pos(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height, cx: e.clientX - r.left, cy: e.clientY - r.top }; }

cv.addEventListener('pointerdown', function (e) {
  if (e.button > 0) return;
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  if (!started) { started = true; hint.classList.add('gone'); }
  var p = pos(e);
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  if (tool === 'brush') {
    drawing = true; last = p; lastT = performance.now(); speed = 0;
    dab(p.x, p.y, SIZES[size] * g); puff(p.cx, p.cy, 3, 26);
  } else {
    var ang = (Math.random() - .5) * .62;
    if (tool === 'paw') stamp(PAW, p.x, p.y, 104 * g, ang);
    else stamp(SNOWMAN, p.x, p.y, 112 * g, ang * .5);
    puff(p.cx, p.cy, tool === 'paw' ? 14 : 20, 55);
    thud(tool === 'paw' ? .7 : 1);
  }
  e.preventDefault();
});
cv.addEventListener('pointermove', function (e) {
  if (!drawing) return;
  var p = pos(e), r = SIZES[size] * g, dx = p.x - last.x, dy = p.y - last.y, dist = Math.sqrt(dx * dx + dy * dy);
  var now = performance.now(), dtm = Math.max(1, now - lastT); lastT = now;
  speed = speed * .6 + (dist / g / dtm) * .4;
  var step = Math.max(1, r * .28), n = Math.max(1, Math.ceil(dist / step));
  for (var i = 1; i <= n; i++) dab(last.x + dx * i / n, last.y + dy * i / n, r);
  if (dist > 1) puff(p.cx, p.cy, 1 + (speed > .6 ? 1 : 0), 22);
  last = p;
});
function endDraw() { drawing = false; }
cv.addEventListener('pointerup', endDraw);
cv.addEventListener('pointercancel', endDraw);
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- main loop ---------- */
var resetting = false, resetT0 = 0, prev = 0;
function setTheme(name) {
  var th = THEMES[name]; if (!th) return;
  themeAnim = { fb: curBase.slice(), fs: curShadow.slice(), tb: th.base, ts: th.shadow, t0: performance.now(), dur: 900 };
  var root = document.documentElement.style;
  root.setProperty('--bg', th.bg); root.setProperty('--ui-fg', th.ui);
  root.setProperty('--ui-bg', th.uiBg); root.setProperty('--ui-on', th.on);
}
function doReset() {
  if (resetting) return;
  resetting = true; resetT0 = performance.now();
  heavy = 260;
  whoosh();
}
function frame(now) {
  var dt = Math.min(.05, (now - prev) / 1000 || .016); prev = now;
  if (themeAnim) {
    var t = Math.min(1, (now - themeAnim.t0) / themeAnim.dur), e = t * t * (3 - 2 * t);
    for (var i = 0; i < 3; i++) {
      curBase[i] = themeAnim.fb[i] + (themeAnim.tb[i] - themeAnim.fb[i]) * e;
      curShadow[i] = themeAnim.fs[i] + (themeAnim.ts[i] - themeAnim.fs[i]) * e;
    }
    fullDirty = true;
    if (t >= 1) themeAnim = null;
  }
  if (resetting) {
    var k = Math.exp(-dt / .42), mx = 0;
    for (var j = 0; j < C.length; j++) {
      C[j] *= k; R[j] *= k;
      if (C[j] > mx) mx = C[j];
    }
    recompute(0, 0, W - 1, H - 1);
    fullDirty = true;
    var el = now - resetT0;
    if (el < 1700) {
      var spawn = Math.round(heavy * dt);
      for (var q = 0; q < spawn; q++) { var fl = newFlake(true); fl.tmp = true; fl.r *= 1.2; fl.vy += 40; flakes.push(fl); }
    }
    if (el > 2300 && mx < .003) { C.fill(0); R.fill(0); recompute(0, 0, W - 1, H - 1); resetting = false; }
    else if (el > 4000) { C.fill(0); R.fill(0); recompute(0, 0, W - 1, H - 1); resetting = false; }
  }
  if (fullDirty) { render(0, 0, W - 1, H - 1); fullDirty = false; dirty = null; }
  else if (dirty) { render(dirty.x0, dirty.y0, dirty.x1, dirty.y1); dirty = null; }
  drawFx(dt, now);
  updateScratch(dt);
  requestAnimationFrame(frame);
}

/* ---------- audio (Web Audio, no files) ---------- */
var AC = null, master, bus, noiseBuf, scratchGain, scratchFilt, muted = false;
var nextChord = 0, nextNote = 0;
var CHORDS = [
  [130.81, 164.81, 196.0, 246.94],   // Cmaj7
  [110.0, 130.81, 164.81, 196.0],    // Am7
  [174.61, 220.0, 261.63, 329.63],   // Fmaj7
  [98.0, 146.83, 196.0, 246.94]      // G6/9 flavour
];
var PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25];
var chordIdx = 0, lastNote = 2;

function initAudio() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : .9; master.connect(AC.destination);
  var len = Math.floor(AC.sampleRate * 3), ir = AC.createBuffer(2, len, AC.sampleRate);
  for (var ch = 0; ch < 2; ch++) { var d = ir.getChannelData(ch); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  var conv = AC.createConvolver(); conv.buffer = ir;
  var rev = AC.createGain(); rev.gain.value = .6; conv.connect(rev); rev.connect(master);
  var dry = AC.createGain(); dry.gain.value = .7; dry.connect(master);
  bus = AC.createGain(); bus.gain.value = .55; bus.connect(dry); bus.connect(conv);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  var nd = noiseBuf.getChannelData(0); for (var n = 0; n < nd.length; n++) nd[n] = Math.random() * 2 - 1;
  var src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  scratchFilt = AC.createBiquadFilter(); scratchFilt.type = 'bandpass'; scratchFilt.frequency.value = 2800; scratchFilt.Q.value = .6;
  scratchGain = AC.createGain(); scratchGain.gain.value = 0;
  src.connect(scratchFilt); scratchFilt.connect(scratchGain); scratchGain.connect(master); src.start();
  nextChord = AC.currentTime + .1; nextNote = AC.currentTime + 2.5;
  schedule(); setInterval(schedule, 400);
}

function pad(freq, t, dur) {
  for (var k = 0; k < 2; k++) {
    var o = AC.createOscillator(), f = AC.createBiquadFilter(), a = AC.createGain();
    o.type = k ? 'sine' : 'triangle'; o.frequency.value = freq; o.detune.value = (k ? 6 : -6);
    f.type = 'lowpass'; f.frequency.value = 650; f.Q.value = .3;
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(.045, t + 3); a.gain.linearRampToValueAtTime(.03, t + dur - 1.5);
    a.gain.linearRampToValueAtTime(0, t + dur + 2.5);
    o.connect(f); f.connect(a); a.connect(bus);
    o.start(t); o.stop(t + dur + 2.6);
  }
}
function hum(freq, t) {
  var o = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain(), f = AC.createBiquadFilter(), a = AC.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  lfo.frequency.value = 4.6; lg.gain.value = freq * .006; lfo.connect(lg); lg.connect(o.frequency);
  f.type = 'lowpass'; f.frequency.value = 1100;
  a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(.075, t + .45); a.gain.exponentialRampToValueAtTime(.0008, t + 2.6);
  o.connect(f); f.connect(a); a.connect(bus);
  o.start(t); lfo.start(t); o.stop(t + 2.7); lfo.stop(t + 2.7);
}
function schedule() {
  if (!AC) return;
  var now = AC.currentTime;
  while (nextChord < now + 2) {
    var ch = CHORDS[chordIdx % CHORDS.length]; chordIdx++;
    for (var i = 0; i < ch.length; i++) pad(ch[i], nextChord, 8);
    nextChord += 8;
  }
  while (nextNote < now + 2) {
    if (Math.random() > .25) {
      lastNote = Math.max(0, Math.min(PENTA.length - 1, lastNote + Math.round((Math.random() - .5) * 4)));
      hum(PENTA[lastNote], nextNote);
    }
    nextNote += 1.7 + Math.random() * 2.2;
  }
}
function thud(level) {
  if (!AC) return;
  var t = AC.currentTime;
  var o = AC.createOscillator(), a = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(125, t); o.frequency.exponentialRampToValueAtTime(52, t + .16);
  a.gain.setValueAtTime(.0001, t); a.gain.exponentialRampToValueAtTime(.34 * level, t + .012); a.gain.exponentialRampToValueAtTime(.0001, t + .26);
  o.connect(a); a.connect(master); o.start(t); o.stop(t + .3);
  var s = AC.createBufferSource(), f = AC.createBiquadFilter(), b = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 520;
  b.gain.setValueAtTime(.0001, t); b.gain.exponentialRampToValueAtTime(.2 * level, t + .01); b.gain.exponentialRampToValueAtTime(.0001, t + .2);
  s.connect(f); f.connect(b); b.connect(master); s.start(t, Math.random()); s.stop(t + .25);
}
function whoosh() {
  if (!AC) return;
  var t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), b = AC.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = .5;
  f.frequency.setValueAtTime(700, t); f.frequency.linearRampToValueAtTime(2400, t + 1.1); f.frequency.linearRampToValueAtTime(900, t + 2.2);
  b.gain.setValueAtTime(.0001, t); b.gain.linearRampToValueAtTime(.18, t + .9); b.gain.linearRampToValueAtTime(.0001, t + 2.3);
  s.connect(f); f.connect(b); b.connect(master); s.start(t, 0); s.stop(t + 2.4);
}
function updateScratch(dt) {
  if (!AC || !scratchGain) return;
  var now = AC.currentTime;
  speed *= Math.pow(.02, dt);
  var target = drawing ? Math.min(.3, speed * .16) : 0;
  scratchGain.gain.setTargetAtTime(target, now, .05);
  scratchFilt.frequency.setTargetAtTime(2200 + Math.min(3, speed) * 700, now, .08);
}
function setMuted(m) {
  muted = m;
  var b = $('bMute');
  b.setAttribute('aria-pressed', m ? 'true' : 'false');
  b.setAttribute('aria-label', m ? 'เปิดเสียง' : 'ปิดเสียง');
  $('waves').style.display = m ? 'none' : '';
  $('slash').style.display = m ? '' : 'none';
  if (AC) master.gain.setTargetAtTime(m ? 0 : .9, AC.currentTime, .15);
}

/* ---------- toolbar ---------- */
function pick(group, attr, val) {
  var btns = $(group).querySelectorAll('.btn');
  for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', btns[i].getAttribute(attr) === val ? 'true' : 'false');
}
$('gTheme').addEventListener('click', function (e) {
  var b = e.target.closest('.btn'); if (!b) return;
  var n = b.getAttribute('data-theme'); pick('gTheme', 'data-theme', n); setTheme(n);
});
$('gTool').addEventListener('click', function (e) {
  var b = e.target.closest('.btn'); if (!b) return;
  tool = b.getAttribute('data-tool'); pick('gTool', 'data-tool', tool);
  $('gSize').classList.toggle('dim', tool !== 'brush');
});
$('gSize').addEventListener('click', function (e) {
  var b = e.target.closest('.btn'); if (!b) return;
  size = b.getAttribute('data-size'); pick('gSize', 'data-size', size);
  if (tool !== 'brush') { tool = 'brush'; pick('gTool', 'data-tool', 'brush'); $('gSize').classList.remove('dim'); }
});
$('bReset').addEventListener('click', doReset);
$('bMute').addEventListener('click', function () { initAudio(); if (AC && AC.state === 'suspended') AC.resume(); setMuted(!muted); });

window.addEventListener('resize', resize);
resize();
$('gSize').classList.toggle('dim', tool !== 'brush');
requestAnimationFrame(frame);
})();
</script>
